# Option A: File-based H2 (persists to ./data/ordersdb on disk)
spring.datasource.url=jdbc:h2:file:./data/ordersdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Option B (uncomment instead of Option A for in-memory H2):
# spring.datasource.url=jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1

spring.datasource.driver-class-name=org.h2.Driver

# Optional: browser UI at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Second microservice & HTTP client settings
services.customer.base-url=http://localhost:8081
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

server.port=8081